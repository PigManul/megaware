; =====================================================================
;  MEGAWARE — firmware for LilyGo T-Embed CC1101 (ESP32-S3)
; =====================================================================
;  Open this folder as a PlatformIO project. There is no built-in
;  board definition for "T-Embed CC1101" in the PlatformIO registry,
;  so board = lilygo-t-display-s3 is used — same ESP32-S3-WROOM-1
;  module (16MB Flash / 8MB OPI PSRAM).
;
;  TESTED ONLY ON LilyGo T-Embed CC1101.
;  Other environments below are build-configured from Bruce pin maps
;  but are UNTESTED — encoder-based navigation requires hardware
;  with a rotary encoder. Boards with keyboards / touchscreens need
;  an input abstraction layer (not yet implemented).
; =====================================================================

[env:t-embed-cc1101]
platform = espressif32 @ 6.3.0
board = lilygo-t-display-s3
framework = arduino

board_build.partitions = huge_app.csv

monitor_speed  = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed   = 921600
upload_port  = COM3
monitor_port = COM3

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DMW_FW_NAME=\"MEGAWARE\"
    -DMW_FW_VERSION=\"1.0.0\"

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    fastled/FastLED @ ^3.9.12
    https://github.com/kodediy/kode_BQ27220.git
    https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git
    https://github.com/adafruit/Adafruit-PN532.git
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    IRremoteESP8266@^2.8.6
    nrf24/RF24@^1.4.8
    https://github.com/sapteinkabeltann/lua511-esp32.git
    https://github.com/cesanta/elk.git

lib_ldf_mode = deep+

; =====================================================================
;  Board variants — build-configured from Bruce pin maps, UNTESTED.
;  Encoder-based navigation requires a rotary encoder; boards with
;  keyboards / touchscreens need an input abstraction layer.
; =====================================================================

[env:t-embed-no-cc1101]
platform = espressif32 @ 6.3.0
board = lilygo-t-display-s3
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    ${env:t-embed-cc1101.build_flags}
    -DMW_NO_CC1101
lib_deps =
    ${env:t-embed-cc1101.lib_deps}

[env:m5stack-cardputer]
platform = espressif32 @ 6.3.0
board = m5stack-cardputer
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    ${env:t-embed-cc1101.build_flags}
    -DMW_NO_CC1101
    -DMW_NO_PN532
    -DMW_NO_ENCODER
lib_deps =
    ${env:t-embed-cc1101.lib_deps}

[env:m5stack-sticks3]
platform = espressif32 @ 6.3.0
board = m5stack-sticks3
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    ${env:t-embed-cc1101.build_flags}
    -DMW_NO_CC1101
    -DMW_NO_PN532
    -DMW_NO_ENCODER
lib_deps =
    ${env:t-embed-cc1101.lib_deps}
